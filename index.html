<style>
:root{--bg:#05080e;--card:#0b1420;--line:#12324a;--cy:#00e1ff;--cyd:#0a7f99;--tx:#d8f6ff;--mut:#6f93a6;--red:#ff4652;--amb:#ffbe3c;--ok:#3ee08f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
body{background-image:linear-gradient(rgba(0,225,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,225,255,.03) 1px,transparent 1px);background-size:24px 24px;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:42px;height:42px;border:2px solid var(--cy);border-radius:50%;display:grid;place-items:center;font:800 20px ui-monospace,Menlo,monospace;color:var(--cy);box-shadow:0 0 12px rgba(0,225,255,.4)}
h1{font:700 18px ui-monospace,Menlo,monospace;letter-spacing:.3em;margin:0;color:var(--cy)}
.sub{color:var(--mut);font:12px ui-monospace,Menlo,monospace}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;position:relative}
.card h2{font:600 12px ui-monospace,Menlo,monospace;letter-spacing:.15em;color:var(--cyd);margin:0 0 10px;text-transform:uppercase}
.big{font:700 30px ui-monospace,Menlo,monospace;color:var(--cy)}
.big small{font-size:14px;color:var(--mut)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bar{height:8px;background:#0e2233;border-radius:5px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--cy);border-radius:5px}
.bar i.over{background:var(--red)}.bar i.low{background:var(--amb)}
.lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.lbl b{color:var(--tx);font-weight:600}
ul{list-style:none;margin:0;padding:0}
li{padding:7px 0;border-top:1px solid #0f2537;display:flex;gap:10px}
li:first-child{border-top:0}
.t{font:12px ui-monospace,Menlo,monospace;color:var(--cy);min-width:44px}
.due{margin-left:auto;color:var(--mut);font-size:12px;white-space:nowrap}
.ok{color:var(--ok)}.bad{color:var(--red)}.warn{color:var(--amb)}
svg{width:100%;height:auto;display:block}
/* обзор: плитки */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;-webkit-tap-highlight-color:transparent;min-width:0}
.tile:active{border-color:var(--cyd)}
.tile .k{font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--cyd);text-transform:uppercase}
.tile .v{font:700 22px ui-monospace,Menlo,monospace;color:var(--cy);margin:4px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v small{font-size:12px;color:var(--mut)}
.tile .s{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .bar{margin:6px 0 0;height:5px}
/* вкладки */
.tab[hidden]{display:none}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:calc(100% - 24px);max-width:536px;
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;background:rgba(11,20,32,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:22px;box-shadow:0 6px 24px rgba(0,0,0,.5);z-index:4}
nav[hidden]{display:none}
nav button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 5px;border-radius:16px;color:var(--mut);font-size:11px;-webkit-tap-highlight-color:transparent}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--cy);background:rgba(0,225,255,.09)}
/* экран блокировки */
#lock{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:16px;z-index:5;overflow-y:auto}
#lock .box{width:100%;max-width:360px;text-align:center}
#lock input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--cyd);background:#07111b;color:var(--tx);font-size:16px;margin:14px 0 8px;text-align:center}
#lock button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--cy);color:#001a22;font-weight:700;font-size:15px}
#lock label{display:block;color:var(--mut);font-size:13px;margin-top:10px}
#err{color:var(--red);min-height:20px;font-size:13px;margin-top:10px}
.eye{width:64px;height:64px;margin:0 auto;border:2px solid var(--cy);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 18px rgba(0,225,255,.35)}
.eye i{width:16px;height:16px;border-radius:50%;background:var(--red);box-shadow:0 0 14px var(--red)}
/* ключ: создание, смена фразы */
#lock .note{font-size:14px;line-height:1.45;margin:18px 0 2px;text-align:left}
#lock .note small{display:block;color:var(--mut);font-size:12px;margin-top:8px}
#lock textarea{width:100%;height:92px;padding:10px;border-radius:10px;border:1px solid var(--cyd);background:#07111b;color:var(--tx);font:12px/1.35 ui-monospace,Menlo,monospace;margin:12px 0 8px;resize:none;word-break:break-all}
#lock button.ghost{background:transparent;border:1px solid var(--cyd);color:var(--cy);margin-top:8px}
#lock button:disabled{opacity:.6}
#lock .links{margin-top:16px}
#lock .lnk{all:unset;cursor:pointer;color:var(--mut);font-size:13px;text-decoration:underline;margin:0 8px}
#err.ok{color:var(--ok)}
header .lockbtn{all:unset;cursor:pointer;margin-left:auto;padding:6px;color:var(--mut);-webkit-tap-highlight-color:transparent}
header .lockbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div id="lock"><div class="box">
  <div class="eye"><i></i></div>
  <h1 style="margin-top:14px">D U N N</h1>
  <div class="sub">GTD // ENCRYPTED</div>
  <div id="v-wait" class="sub" style="margin-top:18px">…</div>
  <div id="v-unlock" hidden>
    <input id="pw" type="password" placeholder="фраза-пароль" autocomplete="current-password">
    <button id="go">Открыть</button>
    <label><input id="rem" type="checkbox" style="width:auto;margin:0 6px 0 0">запомнить на этом устройстве</label>
  </div>
  <div id="v-setup" hidden>
    <div class="note" id="s-note"></div>
    <input id="cur" type="password" placeholder="текущая фраза" autocomplete="current-password" hidden>
    <input id="np1" type="password" placeholder="новая фраза" autocomplete="new-password">
    <input id="np2" type="password" placeholder="ещё раз" autocomplete="new-password">
    <button id="mk">Создать ключ</button>
  </div>
  <div id="v-key" hidden>
    <div class="note" id="k-note"></div>
    <textarea id="keytxt" readonly></textarea>
    <button id="copy">Скопировать</button>
    <button id="done" class="ghost">Готово</button>
  </div>
  <div id="err"></div>
  <div class="links" id="links" hidden><button class="lnk" id="l-change">сменить фразу</button><button class="lnk" id="l-reset">новый ключ</button></div>
  <div class="links" id="back" hidden><button class="lnk" id="l-back">назад</button></div>
</div></div>

<div class="wrap" id="app" hidden>
  <header><div class="logo">D</div><div><h1>DUNN</h1><div class="sub" id="upd"></div></div><button class="lockbtn" id="lockbtn" title="заблокировать" aria-label="заблокировать"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button></header>
  <section class="tab" data-tab="home"><div class="tiles" id="tiles"></div><div class="card" id="rel"></div></section>
  <section class="tab" data-tab="food" hidden><div class="card" id="food"></div><div class="card" id="meals"></div></section>
  <section class="tab" data-tab="body" hidden><div class="card" id="weight"></div></section>
  <section class="tab" data-tab="tasks" hidden><div class="card" id="tasks"></div></section>
  <section class="tab" data-tab="money" hidden><div class="card" id="money"></div></section>
</div>

<nav id="nav" hidden>
  <button data-tab="home"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="9" rx="2"/><rect x="13.5" y="3" width="7.5" height="5.5" rx="2"/><rect x="3" y="15" width="7.5" height="6" rx="2"/><rect x="13.5" y="11.5" width="7.5" height="9.5" rx="2"/></svg>Обзор</button>
  <button data-tab="food"><svg viewBox="0 0 24 24"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 0 0 5 0V3M7 11v10M17 21V3c-2.5 1.5-3.5 4-3.5 7.5V13H17"/></svg>Еда</button>
  <button data-tab="body"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>Вес</button>
  <button data-tab="tasks"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>Задачи</button>
  <button data-tab="money"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="M2.5 10h19M6.5 15h3"/></svg>Деньги</button>
</nav>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => (Math.round(n * 100) / 100).toLocaleString('ru-RU');
const dm = d => d ? d.slice(8, 10) + '.' + d.slice(5, 7) : '';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const u64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
const utf8 = s => new TextEncoder().encode(s);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
                del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const tg = () => window.Telegram && Telegram.WebApp;
// скрипт Telegram теперь defer → он выполнится до DOMContentLoaded
document.addEventListener('DOMContentLoaded', () => { try { const t = tg(); t && (t.ready(), t.expand()); } catch (e) {} boot(); });

// ── Ключи (схема v2). Данные шифруются открытым ключом Данича: ECDH P-256 → HKDF-SHA256 → AES-256-GCM.
// Пара ключей создаётся здесь, в его браузере. Закрытый ключ хранится только зашифрованным его фразой
// (PBKDF2-SHA256, 600 000 итераций) в Telegram CloudStorage. Фраза не покидает устройство: её не знают
// ни Дан, ни хост. Дан получает только открытый ключ — сообщение DUNN-KEY:…
const ITER = 600000, KEY_ITEM = 'dunn_key', EC = {name: 'ECDH', namedCurve: 'P-256'};
const cloud = () => { try { const t = tg(); return t && t.initData && t.isVersionAtLeast('6.9') ? t.CloudStorage : null; } catch (e) { return null; } };
const kget = k => new Promise(res => { const c = cloud(); if (!c) return res(store.get(k));
  try { c.getItem(k, (e, v) => res(!e && v ? v : store.get(k))); } catch (e) { res(store.get(k)); } });
const kset = (k, v) => new Promise(res => { store.set(k, v); const c = cloud(); if (!c) return res(false);
  try { c.setItem(k, v, (e, ok) => res(!e && !!ok)); } catch (e) { res(false); } });
const kidOf = async pub => hex(await crypto.subtle.digest('SHA-256', b64(pub))).slice(0, 16);
async function pwKey(phrase, salt, iter) {
  const base = await crypto.subtle.importKey('raw', utf8(phrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
}
async function wrap(pk8, pub, phrase) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, await pwKey(phrase, salt, ITER), pk8);
  return {v: 2, pub, iter: ITER, salt: u64(salt), iv: u64(iv), ct: u64(ct)};
}
const unwrap = async (k, phrase) => crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(k.iv)}, await pwKey(phrase, b64(k.salt), k.iter), b64(k.ct));
const importPriv = pk8 => crypto.subtle.importKey('pkcs8', pk8, EC, false, ['deriveBits']);
async function decrypt(enc, priv) {
  const epk = b64(enc.epk);
  const bits = await crypto.subtle.deriveBits({name: 'ECDH', public: await crypto.subtle.importKey('raw', epk, EC, false, [])}, priv, 256);
  const hk = await crypto.subtle.importKey('raw', bits, 'HKDF', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'HKDF', hash: 'SHA-256', salt: epk, info: utf8('dunn-dash v2')}, hk, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(enc.iv)}, key, b64(enc.ct))));
}
// «запомнить»: неизвлекаемый CryptoKey в IndexedDB. Сам ключ из него не достать, фраза не хранится вовсе
function idb(mode, fn) {
  return new Promise((res, rej) => {
    const r = indexedDB.open('dunn', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('k');
    r.onerror = () => rej(r.error);
    r.onsuccess = () => { const tx = r.result.transaction('k', mode), q = fn(tx.objectStore('k'));
      tx.oncomplete = () => res(q.result); tx.onerror = () => rej(tx.error); };
  });
}
const remGet = () => idb('readonly', s => s.get('priv')).catch(() => null);
const remSet = v => idb('readwrite', s => s.put(v, 'priv')).catch(() => {});
const remDel = () => idb('readwrite', s => s.delete('priv')).catch(() => {});

function bar(label, v, t, unit) {
  const pct = t ? Math.min(100, v / t * 100) : 0, cls = v > t * 1.05 ? 'over' : (v < t * .8 ? 'low' : '');
  return `<div class="lbl"><span>${label}</span><span><b>${fmt(v)}</b> / ${fmt(t)} ${unit}</span></div><div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>`;
}
// мини-полоска для плиток: те же цвета, что и на вкладке (перебор — красный, < 80 % — жёлтый)
const mini = (v, t, over) => `<div class="bar"><i class="${over ? 'over' : (t && v < t * .8 ? 'low' : '')}" style="width:${t ? Math.min(100, v / t * 100) : 0}%"></i></div>`;

function chart(pts) {
  if (pts.length < 2) return '<div class="sub">мало данных</div>';
  const W = 520, H = 170, P = 28, ks = pts.flatMap(p => [p.kg, p.avg]);
  const lo = Math.floor(Math.min(...ks) - .3), hi = Math.ceil(Math.max(...ks) + .3);
  const t0 = Date.parse(pts[0].d), t1 = Date.parse(pts[pts.length - 1].d) || t0 + 1;
  const x = d => P + (Date.parse(d) - t0) / (t1 - t0 || 1) * (W - P - 8), y = k => 8 + (hi - k) / (hi - lo) * (H - 30);
  const line = key => pts.map((p, i) => (i ? 'L' : 'M') + x(p.d).toFixed(1) + ' ' + y(p[key]).toFixed(1)).join(' ');
  let grid = '';
  for (let k = lo; k <= hi; k++) grid += `<line x1="${P}" x2="${W}" y1="${y(k)}" y2="${y(k)}" stroke="#12324a"/><text x="2" y="${y(k) + 4}" fill="#6f93a6" font-size="11">${k}</text>`;
  const dots = pts.map(p => `<circle cx="${x(p.d)}" cy="${y(p.kg)}" r="2.6" fill="#6f93a6"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}">${grid}${dots}<path d="${line('avg')}" fill="none" stroke="#00e1ff" stroke-width="2.5"/>
    <text x="${P}" y="${H - 4}" fill="#6f93a6" font-size="11">${dm(pts[0].d)}</text><text x="${W - 40}" y="${H - 4}" fill="#6f93a6" font-size="11">${dm(pts[pts.length - 1].d)}</text></svg>`;
}

function render(d) {
  $('upd').textContent = 'обновлено ' + d.updated;
  const f = d.food, a = d.activity, t = a.target, left = t.kcal - f.kcal;
  const w = d.weight, last = w[w.length - 1], df = d.deficit, k = d.tasks, m = d.money;

  // ── Обзор: плитки, тап ведёт на вкладку
  const tile = (tab, key, val, sub, extra = '') => `<div class="tile" data-go="${tab}"><div class="k">${key}</div><div class="v">${val}</div><div class="s">${sub}</div>${extra}</div>`;
  const nextTask = k.calendar[0] || k.next[0];
  $('tiles').innerHTML =
    tile('food', 'Калории', `${f.kcal}<small> / ${t.kcal}</small>`, left < 0 ? `<span class="bad">перебор ${-left}</span>` : `осталось ${left}`, mini(f.kcal, t.kcal, f.kcal > t.kcal * 1.05)) +
    tile('food', 'Белок', `${f.p}<small> / ${t.p} г</small>`, f.p >= t.p ? '<span class="ok">норма закрыта</span>' : `ещё ${t.p - f.p} г`, mini(f.p, t.p)) +
    tile('body', 'Вес · 7 дн', `${last ? last.avg : '—'}<small> кг</small>`, df ? `<span class="${df.kcal < 0 ? 'bad' : 'ok'}">${df.kcal > 0 ? 'дефицит' : 'профицит'} ${Math.abs(df.kcal)}</span>` : (last ? 'последний ' + dm(last.d) : '')) +
    tile('food', 'Шаги', `${a.steps ?? '—'}`, `база ${a.steps_base}`, a.steps != null ? mini(a.steps, a.steps_base) : '') +
    tile('tasks', 'Задачи', `${k.calendar.length + k.next.length}`, nextTask ? esc(nextTask.t) : 'пусто', '') +
    tile('money', 'Баланс', `<span class="${m.balance < 0 ? 'bad' : ''}">${fmt(m.balance)}</span><small> ₽</small>`, `сегодня ${fmt(m.today)} ₽`);

  // ── Еда
  $('food').innerHTML = `<h2>Питание · ${esc(a.type)}</h2>
    <div class="row"><div class="big">${f.kcal}<small> / ${t.kcal} ккал</small></div><div class="${left < 0 ? 'bad' : 'ok'}">${left < 0 ? 'перебор ' + (-left) : 'осталось ' + left}</div></div>
    <div class="bar"><i class="${f.kcal > t.kcal * 1.05 ? 'over' : ''}" style="width:${Math.min(100, f.kcal / t.kcal * 100)}%"></i></div>
    ${bar('Белок', f.p, t.p, 'г')}${bar('Жиры', f.f, t.f, 'г')}${bar('Углеводы', f.c, t.c, 'г')}
    <div class="lbl"><span>Клетчатка <b>${f.fib} г</b></span><span>Шаги <b>${a.steps ?? '—'}</b> · база ${a.steps_base}</span></div>`;
  $('meals').innerHTML = `<h2>Приёмы пищи</h2>` + (d.meals.length
    ? '<ul>' + d.meals.map(x => `<li><span>${esc(x.name)}</span><span class="due">${x.kcal}</span></li>`).join('') + '</ul>'
    : '<div class="sub">сегодня ещё ничего</div>');

  // ── Вес
  $('weight').innerHTML = `<h2>Вес · средняя за 7 дней</h2>
    <div class="row"><div class="big">${last ? last.avg : '—'}<small> кг</small></div><div class="sub">последний: ${last ? last.kg + ' · ' + dm(last.d) : '—'}</div></div>
    ${chart(w)}
    ${df ? `<div class="lbl" style="margin-top:8px"><span>Неделя с ${dm(df.from)}</span><span class="${df.kcal < 0 ? 'bad' : 'ok'}"><b>${df.kcal > 0 ? 'дефицит ' : 'профицит '}${Math.abs(df.kcal)} ккал</b> · ${Math.abs(df.kg)} кг</span></div>` : ''}`;

  // ── Задачи
  const li = (x, right) => `<li><span class="t">${esc(x.time) || '·'}</span><span>${esc(x.t)}</span>${right ? `<span class="due">${right}</span>` : ''}</li>`;
  $('tasks').innerHTML = `<h2>Сегодня</h2><ul>${k.calendar.map(x => li(x)).join('') || '<li class="sub">в календаре пусто</li>'}</ul>
    <h2 style="margin-top:14px">Дейлики</h2><ul>${k.daily.map(x => li(x)).join('')}</ul>
    <h2 style="margin-top:14px">Текущие действия</h2><ul>${k.next.map(x => li({time: '', t: x.t}, dm(x.due))).join('')}</ul>`;

  // ── Деньги
  $('money').innerHTML = `<h2>Деньги</h2>
    <div class="row"><div class="big ${m.balance < 0 ? 'bad' : ''}">${fmt(m.balance)}<small> ₽</small></div><div class="sub">до: ${esc(m.next_income || '—')}</div></div>
    <div class="lbl"><span>Сегодня <b>${fmt(m.today)} ₽</b></span><span>Неделя <b>${fmt(m.week)} ₽</b></span></div>
    <ul style="margin-top:8px">${m.debts.map(x => `<li><span class="${x.ok ? 'ok' : 'warn'}">${x.ok ? '✓' : '⏳'}</span><span>${esc(x.name)}</span><span class="due">${x.sum} ₽ · ${dm(x.due)}</span></li>`).join('')}</ul>`;

  // ── Релизы (на обзоре, внизу)
  const r = d.releases, ri = x => `<li><span>${esc(x.ru)}</span><span class="due">${x.date ? dm(x.date) : esc(x.window)}</span></li>`;
  $('rel').innerHTML = `<h2>Релизы</h2>
    ${r.soon.length ? '<div class="sub">скоро</div><ul>' + r.soon.map(ri).join('') + '</ul>' : ''}
    ${r.recent.length ? '<div class="sub" style="margin-top:8px">недавно вышло</div><ul>' + r.recent.map(ri).join('') + '</ul>' : ''}
    ${r.later.length ? '<div class="sub" style="margin-top:8px">ждём</div><ul>' + r.later.map(ri).join('') + '</ul>' : ''}`;
}

// ── переключение вкладок; последняя открытая запоминается на устройстве
const TABS = ['home', 'food', 'body', 'tasks', 'money'];
function show(tab) {
  if (!TABS.includes(tab)) tab = 'home';
  document.querySelectorAll('.tab').forEach(s => s.hidden = s.dataset.tab !== tab);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  store.set('dunn_tab', tab); window.scrollTo(0, 0);
  try { tg() && tg().HapticFeedback.selectionChanged(); } catch (e) {}
}
$('nav').onclick = e => { const b = e.target.closest('button'); if (b) show(b.dataset.tab); };
$('tiles').onclick = e => { const x = e.target.closest('[data-go]'); if (x) show(x.dataset.go); };

// ── экран входа: wait → setup (ключа ещё нет) | unlock; key — показать DUNN-KEY для Дана
let K = null;        // зашифрованный фразой ключ Данича из CloudStorage
let mode = 'setup';  // setup | change | reset
function view(v) {
  ['wait', 'unlock', 'setup', 'key'].forEach(n => $('v-' + n).hidden = n !== v);
  $('links').hidden = v !== 'unlock'; $('back').hidden = !(v === 'setup' && K);
  $('lock').style.display = ''; $('app').hidden = true; $('nav').hidden = true;
}
function msg(text, ok) { $('err').textContent = text || ''; $('err').className = ok ? 'ok' : ''; }
async function busy(id, fn) {
  const b = $(id), label = b.textContent; b.disabled = true; b.textContent = '…';
  try { await fn(); } finally { b.disabled = false; b.textContent = label; }
}
function showKey(note) { $('k-note').innerHTML = note; $('keytxt').value = 'DUNN-KEY:' + K.pub; msg(''); view('key'); }
function setup(m) {
  mode = m; msg('');
  ['cur', 'np1', 'np2'].forEach(i => $(i).value = '');
  $('cur').hidden = m !== 'change';
  $('mk').textContent = m === 'change' ? 'Сменить фразу' : 'Создать ключ';
  $('s-note').innerHTML = {
    setup: 'Придумай фразу-пароль для витрины. Она останется только у тебя: ни Дан, ни хост её не знают, поэтому и восстановить её некому.',
    change: 'Смена фразы. Ключ остаётся прежним, Дану ничего отправлять не нужно.',
    reset: 'Новый ключ, если фраза забыта. Старый перестанет работать: после создания отправь новый ключ Дану, витрина откроется после его следующей публикации.',
  }[m] + (cloud() ? '' : '<small>Витрина открыта не из Telegram: ключ сохранится только в этом браузере. Лучше открыть её кнопкой бота.</small>');
  view('setup');
}

async function openWith(priv, kid) {
  let enc;
  try { enc = await (await fetch('data.enc.json?t=' + Date.now(), {cache: 'no-store'})).json(); }
  catch (e) { view('unlock'); msg('Нет связи с витриной. Попробуй позже.'); return false; }
  if (enc.v !== 2 || !enc.kid) { showKey('Дан ещё не получил твой ключ. Отправь ему сообщение ниже целиком: в нём нет ничего секретного, это открытый ключ.'); return false; }
  if (enc.kid !== kid) { showKey('Данные зашифрованы <b>другим</b> ключом. Если ты недавно создавал новый ключ, отправь его Дану ещё раз. Если нет, ключ на сервере подменён: напиши Al.'); return false; }
  let d;
  try { d = await decrypt(enc, priv); } catch (e) { view('unlock'); msg('Данные повреждены или подменены. Напиши Al.'); return false; }
  $('lock').style.display = 'none'; $('app').hidden = false; $('nav').hidden = false;
  render(d); show(store.get('dunn_tab') || 'home');
  return true;
}

$('go').onclick = () => busy('go', async () => {
  msg('');
  let pk8;
  try { pk8 = await unwrap(K, $('pw').value.trim()); } catch (e) { return msg('Не подошло. Проверь фразу.'); }
  $('pw').value = '';
  const priv = await importPriv(pk8), kid = await kidOf(K.pub);
  if ($('rem').checked) await remSet({priv, kid}); else await remDel();
  await openWith(priv, kid);
});
$('pw').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('mk').onclick = () => busy('mk', async () => {
  const p1 = $('np1').value.trim(), p2 = $('np2').value.trim();
  if (p1.length < 10) return msg('Нужно хотя бы 10 символов, лучше 3–4 слова.');
  if (p1 !== p2) return msg('Фразы не совпадают.');
  if (mode === 'change') {
    let pk8;
    try { pk8 = await unwrap(K, $('cur').value.trim()); } catch (e) { return msg('Текущая фраза не подошла.'); }
    K = await wrap(pk8, K.pub, p1);
    await kset(KEY_ITEM, JSON.stringify(K)); await remDel();
    view('unlock'); return msg('Фраза сменена.', true);
  }
  const kp = await crypto.subtle.generateKey(EC, true, ['deriveBits']);
  K = await wrap(await crypto.subtle.exportKey('pkcs8', kp.privateKey), u64(await crypto.subtle.exportKey('raw', kp.publicKey)), p1);
  const synced = await kset(KEY_ITEM, JSON.stringify(K)); await remDel();
  showKey('Ключ создан' + (synced ? '' : ' и сохранён только в этом браузере') + '. Отправь Дану сообщение ниже целиком: в нём нет ничего секретного, это открытый ключ.');
});
$('copy').onclick = async () => {
  const t = $('keytxt');
  try { await navigator.clipboard.writeText(t.value); } catch (e) { t.focus(); t.select(); try { document.execCommand('copy'); } catch (e2) {} }
  msg('Скопировано.', true);
};
$('done').onclick = () => { view('unlock'); msg(''); };
$('l-change').onclick = () => setup('change');
$('l-reset').onclick = () => setup('reset');
$('l-back').onclick = () => { view('unlock'); msg(''); };
$('lockbtn').onclick = async () => { await remDel(); view('unlock'); msg(''); };

async function boot() {
  store.del('dunn_pw');  // от старой схемы: там фраза лежала открытым текстом
  try { K = JSON.parse(await kget(KEY_ITEM) || 'null'); } catch (e) { K = null; }
  if (!K || K.v !== 2) return setup('setup');
  const r = await remGet();
  if (r && r.priv && r.kid === await kidOf(K.pub) && await openWith(r.priv, r.kid)) return;
  if ($('v-key').hidden && $('v-unlock').hidden) view('unlock');
}
</script>
</body>
