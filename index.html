<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => (Math.round(n * 100) / 100).toLocaleString('ru-RU');
const dm = d => d ? d.slice(8, 10) + '.' + d.slice(5, 7) : '';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const u64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
const utf8 = s => new TextEncoder().encode(s);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
                del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const tg = () => window.Telegram && Telegram.WebApp;
// скрипт Telegram теперь defer → он выполнится до DOMContentLoaded
document.addEventListener('DOMContentLoaded', () => { try { const t = tg(); t && (t.ready(), t.expand(), t.disableVerticalSwipes && t.disableVerticalSwipes()); } catch (e) {} boot(); });

// ── Ключи (схема v2). Данные шифруются открытым ключом Данича: ECDH P-256 → HKDF-SHA256 → AES-256-GCM.
// Пара ключей создаётся здесь, в его браузере. Закрытый ключ хранится только зашифрованным его фразой
// (PBKDF2-SHA256, 600 000 итераций) в Telegram CloudStorage. Фраза не покидает устройство: её не знают
// ни Дан, ни хост. Дан получает только открытый ключ — сообщение DUNN-KEY:…
const ITER = 600000, KEY_ITEM = 'dunn_key', EC = {name: 'ECDH', namedCurve: 'P-256'};
const cloud = () => { try { const t = tg(); return t && t.initData && t.isVersionAtLeast('6.9') ? t.CloudStorage : null; } catch (e) { return null; } };
const kget = k => new Promise(res => { const c = cloud(); if (!c) return res(store.get(k));
  try { c.getItem(k, (e, v) => res(!e && v ? v : store.get(k))); } catch (e) { res(store.get(k)); } });
const kset = (k, v) => new Promise(res => { store.set(k, v); const c = cloud(); if (!c) return res(false);
  try { c.setItem(k, v, (e, ok) => res(!e && !!ok)); } catch (e) { res(false); } });
const kidOf = async pub => hex(await crypto.subtle.digest('SHA-256', b64(pub))).slice(0, 16);
async function pwKey(phrase, salt, iter) {
  const base = await crypto.subtle.importKey('raw', utf8(phrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
}
async function wrap(pk8, pub, phrase) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, await pwKey(phrase, salt, ITER), pk8);
  return {v: 2, pub, iter: ITER, salt: u64(salt), iv: u64(iv), ct: u64(ct)};
}
const unwrap = async (k, phrase) => crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(k.iv)}, await pwKey(phrase, b64(k.salt), k.iter), b64(k.ct));
const importPriv = pk8 => crypto.subtle.importKey('pkcs8', pk8, EC, false, ['deriveBits']);
async function decrypt(enc, priv) {
  const epk = b64(enc.epk);
  const bits = await crypto.subtle.deriveBits({name: 'ECDH', public: await crypto.subtle.importKey('raw', epk, EC, false, [])}, priv, 256);
  const hk = await crypto.subtle.importKey('raw', bits, 'HKDF', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'HKDF', hash: 'SHA-256', salt: epk, info: utf8('dunn-dash v2')}, hk, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(enc.iv)}, key, b64(enc.ct))));
}
// «запомнить»: неизвлекаемый CryptoKey в IndexedDB. Сам ключ из него не достать, фраза не хранится вовсе
function idb(mode, fn) {
  return new Promise((res, rej) => {
    const r = indexedDB.open('dunn', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('k');

  const span = vmode === 'day' ? `${esc(wd(x.d))}, ${esc(dm(x.d))}${fdi === 0 ? ' · сегодня' : ''}` : `неделя ${esc(dm(mon))}–${esc(dm(sun))} · дней с записями ${n}`;

  try { enc = await (await fetch('data.enc.json?t=' + Date.now(), {cache: 'no-store'})).json(); }
  catch (e) { view('unlock'); msg('Нет связи с витриной. Попробуй позже.'); return false; }
  if (enc.v !== 2 || !enc.kid) { showKey('Дан ещё не получил твой ключ. Отправь ему сообщение ниже целиком: в нём нет ничего секретного, это открытый ключ.'); return false; }
  if (enc.kid !== kid) { showKey('Данные зашифрованы <b>другим</b> ключом. Если ты недавно создавал новый ключ, отправь его Дану ещё раз. Если нет, ключ на сервере подменён: напиши Al.'); return false; }
  let d;
  try { d = await decrypt(enc, priv); } catch (e) { view('unlock'); msg('Данные повреждены или подменены. Напиши Al.'); return false; }
  $('lock').style.display = 'none'; $('app').hidden = false; $('nav').hidden = false;
  render(d); show(store.get('dunn_tab') || 'home');
  return true;
}

$('go').onclick = () => busy('go', async () => {
  msg('');
  let pk8;
  try { pk8 = await unwrap(K, $('pw').value.trim()); } catch (e) { return msg('Не подошло. Проверь фразу.'); }
  $('pw').value = '';
  const priv = await importPriv(pk8), kid = await kidOf(K.pub);
  if ($('rem').checked) await remSet({priv, kid}); else await remDel();
  await openWith(priv, kid);
});
$('pw').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('mk').onclick = () => busy('mk', async () => {
  const p1 = $('np1').value.trim(), p2 = $('np2').value.trim();
  if (p1.length < 10) return msg('Нужно хотя бы 10 символов, лучше 3–4 слова.');
  if (p1 !== p2) return msg('Фразы не совпадают.');
  if (mode === 'change') {
    let pk8;
    try { pk8 = await unwrap(K, $('cur').value.trim()); } catch (e) { return msg('Текущая фраза не подошла.'); }
    K = await wrap(pk8, K.pub, p1);
    await kset(KEY_ITEM, JSON.stringify(K)); await remDel();
    view('unlock'); return msg('Фраза сменена.', true);
  }
  const kp = await crypto.subtle.generateKey(EC, true, ['deriveBits']);
  K = await wrap(await crypto.subtle.exportKey('pkcs8', kp.privateKey), u64(await crypto.subtle.exportKey('raw', kp.publicKey)), p1);
  const synced = await kset(KEY_ITEM, JSON.stringify(K)); await remDel();
  showKey('Ключ создан' + (synced ? '' : ' и сохранён только в этом браузере') + '. Отправь Дану сообщение ниже целиком: в нём нет ничего секретного, это открытый ключ.');
});
$('copy').onclick = async () => {
  const t = $('keytxt');
  try { await navigator.clipboard.writeText(t.value); } catch (e) { t.focus(); t.select(); try { document.execCommand('copy'); } catch (e2) {} }
  msg('Скопировано.', true);
};
$('done').onclick = () => { view('unlock'); msg(''); };
$('l-change').onclick = () => setup('change');
$('l-reset').onclick = () => setup('reset');
$('l-back').onclick = () => { msg(''); if (K) view('unlock'); else setup(mode); };

// ── перенос ключа на другое устройство (07.11). Строка DUNN-TRANSFER — тот же K, что лежит в CloudStorage:
// закрытый ключ, зашифрованный фразой (PBKDF2 600 000). Без фразы она бесполезна, но и Дану её слать незачем.
const XFER = 'DUNN-TRANSFER:';
$('l-exp').onclick = () => {
  if (!K) return;
  $('k-note').innerHTML = 'Строка переноса: твой ключ, зашифрованный твоей фразой. Скопируй её и вставь на другом устройстве в «у меня уже есть ключ — перенести». <b>Никому не отправляй, Дану тоже</b> — ему она не нужна.';
  $('keytxt').value = XFER + btoa(JSON.stringify(K)); msg(''); view('key');
};
$('l-imp').onclick = () => { $('imptxt').value = ''; $('imppw').value = ''; msg(''); view('imp'); };
$('impgo').onclick = () => busy('impgo', async () => {
  msg('');
  const t = $('imptxt').value.replace(/\s+/g, '');
  let k;
  try { if (!t.startsWith(XFER)) throw 0; k = JSON.parse(atob(t.slice(XFER.length)));
        if (!k || k.v !== 2 || !k.pub || !k.ct || !k.salt || !k.iv || !k.iter) throw 0; }
  catch (e) { return msg('Это не строка переноса. Скопируй её целиком, вместе с DUNN-TRANSFER:'); }
  let pk8;
  try { pk8 = await unwrap(k, $('imppw').value.trim()); } catch (e) { return msg('Фраза не подошла к этому ключу.'); }
  $('imppw').value = ''; $('imptxt').value = '';
  K = k; await kset(KEY_ITEM, JSON.stringify(K));
  const priv = await importPriv(pk8), kid = await kidOf(K.pub);
  if ($('imprem').checked) await remSet({priv, kid}); else await remDel();
  if (!await openWith(priv, kid)) return;
});
$('lockbtn').onclick = async () => { await remDel(); view('unlock'); msg(''); };

async function boot() {
  store.del('dunn_pw');  // от старой схемы: там фраза лежала открытым текстом
  try { K = JSON.parse(await kget(KEY_ITEM) || 'null'); } catch (e) { K = null; }
  if (!K || K.v !== 2) return setup('setup');
  const r = await remGet();
  if (r && r.priv && r.kid === await kidOf(K.pub) && await openWith(r.priv, r.kid)) return;
  if ($('v-key').hidden && $('v-unlock').hidden) view('unlock');
}
</script>
