<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => (Math.round(n * 100) / 100).toLocaleString('ru-RU');
const dm = d => d ? d.slice(8, 10) + '.' + d.slice(5, 7) : '';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const u64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
const utf8 = s => new TextEncoder().encode(s);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
                del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
const tg = () => window.Telegram && Telegram.WebApp;
// скрипт Telegram теперь defer → он выполнится до DOMContentLoaded
document.addEventListener('DOMContentLoaded', () => { try { const t = tg(); t && (t.ready(), t.expand(), t.disableVerticalSwipes && t.disableVerticalSwipes()); } catch (e) {} boot(); });

// ── Ключи (схема v2). Данные шифруются открытым ключом Данича: ECDH P-256 → HKDF-SHA256 → AES-256-GCM.
// Пара ключей создаётся здесь, в его браузере. Закрытый ключ хранится только зашифрованным его фразой
// (PBKDF2-SHA256, 600 000 итераций) в Telegram CloudStorage. Фраза не покидает устройство: её не знают
// ни Дан, ни хост. Дан получает только открытый ключ — сообщение DUNN-KEY:…
const ITER = 600000, KEY_ITEM = 'dunn_key', EC = {name: 'ECDH', namedCurve: 'P-256'};
const cloud = () => { try { const t = tg(); return t && t.initData && t.isVersionAtLeast('6.9') ? t.CloudStorage : null; } catch (e) { return null; } };
const kget = k => new Promise(res => { const c = cloud(); if (!c) return res(store.get(k));
  try { c.getItem(k, (e, v) => res(!e && v ? v : store.get(k))); } catch (e) { res(store.get(k)); } });
const kset = (k, v) => new Promise(res => { store.set(k, v); const c = cloud(); if (!c) return res(false);
  try { c.setItem(k, v, (e, ok) => res(!e && !!ok)); } catch (e) { res(false); } });
const kidOf = async pub => hex(await crypto.subtle.digest('SHA-256', b64(pub))).slice(0, 16);
async function pwKey(phrase, salt, iter) {
  const base = await crypto.subtle.importKey('raw', utf8(phrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
}
async function wrap(pk8, pub, phrase) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, await pwKey(phrase, salt, ITER), pk8);
  return {v: 2, pub, iter: ITER, salt: u64(salt), iv: u64(iv), ct: u64(ct)};
}
const unwrap = async (k, phrase) => crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(k.iv)}, await pwKey(phrase, b64(k.salt), k.iter), b64(k.ct));
const importPriv = pk8 => crypto.subtle.importKey('pkcs8', pk8, EC, false, ['deriveBits']);
async function decrypt(enc, priv) {
  const epk = b64(enc.epk);
  const bits = await crypto.subtle.deriveBits({name: 'ECDH', public: await crypto.subtle.importKey('raw', epk, EC, false, [])}, priv, 256);
  const hk = await crypto.subtle.importKey('raw', bits, 'HKDF', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'HKDF', hash: 'SHA-256', salt: epk, info: utf8('dunn-dash v2')}, hk, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(enc.iv)}, key, b64(enc.ct))));
}
// «запомнить»: неизвлекаемый CryptoKey в IndexedDB. Сам ключ из него не достать, фраза не хранится вовсе
function idb(mode, fn) {
  return new Promise((res, rej) => {
    const r = indexedDB.open('dunn', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('k');
    r.onerror = () => rej(r.error);
    r.onsuccess = () => { const tx = r.result.transaction('k', mode), q = fn(tx.objectStore('k'));
      tx.oncomplete = () => res(q.result); tx.onerror = () => rej(tx.error); };
  });
}
const remGet = () => idb('readonly', s => s.get('priv')).catch(() => null);
const remSet = v => idb('readwrite', s => s.put(v, 'priv')).catch(() => {});
const remDel = () => idb('readwrite', s => s.delete('priv')).catch(() => {});

// иконки БЖУ (inline SVG): белок — окорочок, жиры — капля масла, углеводы — колос, клетчатка — лист
const ICO = {
  p: '<path d="M13.2 13.8c-2.6-2.6-2.4-7 .4-9.7s7-2.9 9 -.9-.5 6.5-3.2 9.2-3.6 4-6.2 1.4z"/><path d="M13.2 13.8 7.6 19.4"/><circle cx="5.7" cy="18.6" r="1.7"/><circle cx="8.4" cy="21.3" r="1.7"/>',
  f: '<path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"/><path d="M9.3 14.6a2.7 2.7 0 0 0 2.7 2.7"/>',
  c: '<path d="M12 22V9"/><path d="M12 9c-1.3-1.3-1.3-4 0-5.6 1.3 1.6 1.3 4.3 0 5.6z"/><path d="M12 13.5c-2.2-.3-3.8-2-4-4.3 2.2.2 3.8 1.9 4 4.3zm0 0c2.2-.3 3.8-2 4-4.3-2.2.2-3.8 1.9-4 4.3z"/><path d="M12 18c-2.2-.3-3.8-2-4-4.3 2.2.2 3.8 1.9 4 4.3zm0 0c2.2-.3 3.8-2 4-4.3-2.2.2-3.8 1.9-4 4.3z"/>',
  fb: '<path d="M5 19c0-8 5-13 15-14-1 10-6 15-14 15"/><path d="M5 19 13 11"/>'
};
const ico = k => `<span class="mi ${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICO[k]}</svg></span>`;
function bar(label, v, t, unit, k) {
  const pct = t ? Math.min(100, v / t * 100) : 0, cls = v > t * 1.05 ? 'over' : (v < t * .8 ? 'low' : '');
  return `<div class="lbl"><span>${k ? ico(k) : ''}${label}</span><span><b>${fmt(v)}</b> / ${fmt(t)} ${unit}</span></div><div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>`;
}
// мини-полоска для плиток: те же цвета, что и на вкладке (перебор — красный, < 80 % — жёлтый)
const mini = (v, t, over) => `<div class="bar"><i class="${over ? 'over' : (t && v < t * .8 ? 'low' : '')}" style="width:${t ? Math.min(100, v / t * 100) : 0}%"></i></div>`;

function chart(pts, sel) {
  if (pts.length < 2) return '<div class="sub">мало данных</div>';
  const W = 520, H = 170, P = 28, ks = pts.flatMap(p => [p.kg, p.avg]);
  const lo = Math.floor(Math.min(...ks) - .3), hi = Math.ceil(Math.max(...ks) + .3);
  const t0 = Date.parse(pts[0].d), t1 = Date.parse(pts[pts.length - 1].d) || t0 + 1;
  const x = d => P + (Date.parse(d) - t0) / (t1 - t0 || 1) * (W - P - 8), y = k => 8 + (hi - k) / (hi - lo) * (H - 30);
  const line = key => pts.map((p, i) => (i ? 'L' : 'M') + x(p.d).toFixed(1) + ' ' + y(p[key]).toFixed(1)).join(' ');
  let grid = '';
  for (let k = lo; k <= hi; k++) grid += `<line x1="${P}" x2="${W}" y1="${y(k)}" y2="${y(k)}" stroke="#12324a"/><text x="2" y="${y(k) + 4}" fill="#6f93a6" font-size="11">${k}</text>`;
  const dots = pts.map(p => `<circle cx="${x(p.d)}" cy="${y(p.kg)}" r="2.6" fill="#6f93a6"/>`).join('')
    + (sel != null && pts[sel] ? `<line x1="${x(pts[sel].d)}" x2="${x(pts[sel].d)}" y1="8" y2="${H - 22}" stroke="#0a7f99" stroke-dasharray="3 3"/><circle cx="${x(pts[sel].d)}" cy="${y(pts[sel].kg)}" r="6" fill="none" stroke="#00e1ff" stroke-width="2"/>` : '');
  return `<svg viewBox="0 0 ${W} ${H}">${grid}${dots}<path d="${line('avg')}" fill="none" stroke="#00e1ff" stroke-width="2.5"/>
    <text x="${P}" y="${H - 4}" fill="#6f93a6" font-size="11">${dm(pts[0].d)}</text><text x="${W - 40}" y="${H - 4}" fill="#6f93a6" font-size="11">${dm(pts[pts.length - 1].d)}</text></svg>`;
}

function render(d) {
  $('upd').textContent = 'обновлено ' + d.updated;
  const f = d.food, a = d.activity, t = a.target, left = t.kcal - f.kcal;
  const w = d.weight, last = w[w.length - 1], df = d.deficit, k = d.tasks, m = d.money;

  // ── Обзор: плитки, тап ведёт на вкладку
  const tile = (tab, key, val, sub, extra = '') => `<div class="tile" data-go="${tab}"><div class="k">${key}</div><div class="v">${val}</div><div class="s">${sub}</div>${extra}</div>`;
  const nextTask = k.calendar[0] || k.next[0];
  const wk = d.workouts || [], lastW = wk[0], today = d.date || new Date().toISOString().slice(0, 10);
  const days = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
  const sinceW = lastW ? days(lastW.d, today) : null;
  $('tiles').innerHTML =
    tile('food', 'Калории', `${f.kcal}<small> / ${t.kcal}</small>`, left < 0 ? `<span class="bad">перебор ${-left}</span>` : `осталось ${left}`, mini(f.kcal, t.kcal, f.kcal > t.kcal * 1.05)) +
    tile('food', 'Белок', `${f.p}<small> / ${t.p} г</small>`, f.p >= t.p ? '<span class="ok">норма закрыта</span>' : `ещё ${t.p - f.p} г`, mini(f.p, t.p)) +
    tile('body', 'Вес · 7 дн', `${last ? last.avg : '—'}<small> кг</small>`, df ? `<span class="${df.kcal < 0 ? 'bad' : 'ok'}">${df.kcal > 0 ? 'дефицит' : 'профицит'} ${Math.abs(df.kcal)}</span>` : (last ? 'последний ' + dm(last.d) : '')) +
    tile('food', 'Шаги', `${a.steps ?? '—'}`, `база ${a.steps_base}`, a.steps != null ? mini(a.steps, a.steps_base) : '') +
    tile('tasks', 'Задачи', `${k.calendar.length + k.next.length}`, nextTask ? esc(nextTask.t) : 'пусто', '') +
    tile('gym', 'Тренировка', lastW ? `${sinceW}<small> дн назад</small>` : '—', lastW ? esc(dm(lastW.d) + ' · ' + (lastW.kind || []).join(', ')) : 'за 8 недель пусто') +
    tile('money', 'Баланс', `<span class="${m.balance < 0 ? 'bad' : ''}">${fmt(m.balance)}</span><small> ₽</small>`, `сегодня ${fmt(m.today)} ₽`).replace('class="tile"', 'class="tile wide"');

  // ── Еда: листалка по дням (food_days, сегодня первым)
  D = d; FD = (d.food_days && d.food_days.length) ? d.food_days : [{d: today, food: f, meals: d.meals, type: a.type, steps: a.steps, target: t}];
  if (fdi >= FD.length) fdi = 0;
  renderFood();

  // ── Вес
  WPTS = w; if (wsel == null || wsel >= w.length) wsel = w.length - 1; DF = df;
  renderWeight(); renderSteps();

  // ── Задачи
  // тап по задаче открывает её страницу в Notion (dunnLinks.notion, id из build.py)
  const okId = id => /^[0-9a-f]{32}$/i.test(String(id || '').replace(/-/g, ''));
  const li = (x, right) => { const go = okId(x.id);
    return `<li${go ? ` class="go" data-id="${esc(x.id)}"` : ''}><span class="t">${esc(x.time) || '·'}</span><span>${esc(x.t)}${go ? '<span class="arr">↗</span>' : ''}</span>${right ? `<span class="due">${right}</span>` : ''}</li>`; };
  $('tasks').innerHTML = `<h2>Сегодня</h2><ul>${k.calendar.map(x => li(x)).join('') || '<li class="sub">в календаре пусто</li>'}</ul>
    <h2 style="margin-top:14px">Дейлики</h2><ul>${k.daily.map(x => li(x)).join('')}</ul>
    <h2 style="margin-top:14px">Текущие действия</h2><ul>${k.next.map(x => li({time: '', t: x.t, id: x.id}, dm(x.due))).join('')}</ul>
    <div class="sub" style="margin-top:10px">↗ тап по задаче открывает её в Notion</div>`;

  // ── Тренировки: дневник
  GD = {today, wk, log: (d.training && d.training.log) || [], tpl: (d.training && d.training.templates) || []};
  renderGym();

  // ── Деньги
  $('money').innerHTML = `<h2>Деньги</h2>
    <div class="row"><div class="big ${m.balance < 0 ? 'bad' : ''}">${fmt(m.balance)}<small> ₽</small></div><div class="sub">до: ${esc(m.next_income || '—')}</div></div>
    <div class="lbl"><span>Сегодня <b>${fmt(m.today)} ₽</b></span><span>Неделя <b>${fmt(m.week)} ₽</b></span></div>
    <ul style="margin-top:8px">${m.debts.map(x => `<li><span class="${x.ok ? 'ok' : 'warn'}">${x.ok ? '✓' : '⏳'}</span><span>${esc(x.name)}</span><span class="due">${x.sum} ₽ · ${dm(x.due)}</span></li>`).join('')}</ul>`;

  // ── Релизы (на обзоре, внизу)
  const r = d.releases, ri = x => `<li><span>${esc(x.ru)}</span><span class="due">${x.date ? dm(x.date) : esc(x.window)}</span></li>`;
  $('rel').innerHTML = `<h2>Релизы</h2>
    ${r.soon.length ? '<div class="sub">скоро</div><ul>' + r.soon.map(ri).join('') + '</ul>' : ''}
    ${r.recent.length ? '<div class="sub" style="margin-top:8px">недавно вышло</div><ul>' + r.recent.map(ri).join('') + '</ul>' : ''}
    ${r.later.length ? '<div class="sub" style="margin-top:8px">ждём</div><ul>' + r.later.map(ri).join('') + '</ul>' : ''}`;
}

// ── Еда: выбранный день (0 = сегодня). Не запоминается: при открытии всегда сегодня.
let D = null, FD = [], fdi = 0;
const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
const wd = s => WD[new Date(s + 'T00:00:00Z').getUTCDay()];
const kcls = (x) => { const k = x.food && x.food.kcal, tk = x.target && x.target.kcal;
  return !k ? '' : (k > tk * 1.05 ? 'over' : (k < tk * .8 ? 'low' : 'ok')); };
function renderFood() {
  const x = FD[fdi], f = x.food || {kcal: 0, p: 0, f: 0, c: 0, fib: 0}, t = x.target || {kcal: 0, p: 0, f: 0, c: 0};
  const left = t.kcal - f.kcal, isToday = fdi === 0, meals = x.meals || [];
  const base = isToday && D.activity ? D.activity.steps_base : null;
  const wo = (D.workouts || []).find(w => w.d === x.d);
  $('fdays').innerHTML = `<div class="dnav"><button data-step="1" ${fdi >= FD.length - 1 ? 'disabled' : ''} aria-label="день назад">‹</button>
    <div class="dl">${esc(wd(x.d))}, ${esc(dm(x.d))}${isToday ? ' · сегодня' : ''}<svg class="cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><small>${esc(x.type || '')}</small>
    <input type="date" aria-label="выбрать дату" min="${esc(FD[FD.length - 1].d)}" max="${esc(FD[0].d)}" value="${esc(x.d)}"></div>
    <button data-step="-1" ${isToday ? 'disabled' : ''} aria-label="день вперёд">›</button></div>
    <div class="strip">${FD.map((y, i) => `<button data-i="${i}" class="${i === fdi ? 'on' : ''}"><b>${esc(y.d.slice(8, 10))}</b>${esc(wd(y.d))}<i class="${kcls(y)}"></i></button>`).join('')}</div>`;
  $('food').innerHTML = `<h2>Питание · ${esc(x.type || '')}</h2>
    <div class="row"><div class="big">${f.kcal}<small> / ${t.kcal} ккал</small></div><div class="${left < 0 ? 'bad' : 'ok'}">${left < 0 ? 'перебор ' + (-left) : (isToday ? 'осталось ' : 'недобор ') + left}</div></div>
    <div class="bar"><i class="${f.kcal > t.kcal * 1.05 ? 'over' : ''}" style="width:${t.kcal ? Math.min(100, f.kcal / t.kcal * 100) : 0}%"></i></div>
    ${bar('Белок', f.p, t.p, 'г', 'p')}${bar('Жиры', f.f, t.f, 'г', 'f')}${bar('Углеводы', f.c, t.c, 'г', 'c')}
    <div class="lbl"><span>${ico('fb')}Клетчатка <b>${f.fib} г</b></span><span>Шаги <b>${x.steps ?? '—'}</b>${base ? ' · база ' + base : ''}</span></div>
    ${wo ? `<div class="wline">Тренировка: <b>${esc((wo.kind || []).join(', ') || 'была')}</b>${wo.min ? ' · ' + esc(wo.min) + ' мин' : ''}</div>` : ''}
    ${!isToday ? '<div class="sub" style="margin-top:8px">Б/Ж/У цели прошлых дней — по текущему плану</div>' : ''}`;
  $('meals').innerHTML = `<h2>Приёмы пищи</h2>` + (meals.length ? mealsHtml(meals, f) : `<div class="sub">${isToday ? 'сегодня ещё ничего' : 'в этот день ничего не записано'}</div>`);
}
const SLOT_ICO = {'Завтрак': '🍳', 'Обед': '🍲', 'Перекус': '🍎', 'Ужин': '🌙', 'Без времени': '🕓'};
const r1 = v => Math.round((v || 0) * 10) / 10;
function mealsHtml(meals, f) {
  // группы по slot в порядке первого появления; старые записи без поля slot — одной группой
  const order = [], by = {};
  meals.forEach(m => { const k = m.slot || 'Без времени'; if (!by[k]) { by[k] = []; order.push(k); } by[k].push(m); });
  const onlyNoTime = order.length === 1 && order[0] === 'Без времени';
  const sumOf = arr => arr.reduce((a, m) => ({kcal: a.kcal + (m.kcal || 0), p: a.p + (m.p || 0), f: a.f + (m.f || 0), c: a.c + (m.c || 0)}), {kcal: 0, p: 0, f: 0, c: 0});
  const sec = k => { const arr = by[k], s = sumOf(arr), ts = arr.map(m => m.t).filter(Boolean);
    const tm = ts.length ? (ts[0] === ts[ts.length - 1] ? ts[0] : ts[0] + '–' + ts[ts.length - 1]) : '';

    const f = newDraft(e.target.value); if (cur) f.date = cur.date; store.set('dunn_wdraft', JSON.stringify(f)); renderGym(); return; }
  if (e.target.id === 'w-add' && e.target.value) { const f = saveDraftFromDom(), n = e.target.value, l = lastOf(n);
    f.ex.push({name: n, reps: '', load: l ? l.load : '', s1: '', s2: '', rpe: '', note: '', last: l ? `${l.load || '—'} × ${setStr(l)} · ${dm(l.d)}` : ''});
    store.set('dunn_wdraft', JSON.stringify(f)); renderGym(); }
});
$('workouts').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.gv) { gv = b.dataset.gv; store.set('dunn_gv', gv); renderGym(); hap(); return; }
  if (b.dataset.m) { const [Y, M] = gMonth.split('-').map(Number), t = new Date(Date.UTC(Y, M - 1 + Number(b.dataset.m), 1)); gMonth = t.toISOString().slice(0, 7); renderGym(); hap(); return; }
  if (b.dataset.d) { gSel = b.dataset.d; renderGym(); hap(); return; }
  if (b.dataset.rm) { const f = saveDraftFromDom(); f.ex.splice(Number(b.dataset.rm), 1); store.set('dunn_wdraft', JSON.stringify(f)); renderGym(); return; }
  if (b.id === 'w-addc') { const n = (prompt('Название упражнения') || '').trim(); if (!n) return; const f = saveDraftFromDom();
    f.ex.push({name: n, reps: '', load: '', s1: '', s2: '', rpe: '', note: '', last: ''}); store.set('dunn_wdraft', JSON.stringify(f)); renderGym(); return; }
  if (b.id === 'w-reset') { if (!confirm('Сбросить черновик тренировки?')) return; store.del('dunn_wdraft'); renderGym(); return; }
  if (b.id === 'w-save') { const f = saveDraftFromDom(), txt = gymText(f); f.saved = true; store.set('dunn_wdraft', JSON.stringify(f));
    if (txt.split('\n').length < 2) { $('w-hint').textContent = 'Заполни хотя бы одно упражнение'; return; }
    try { await navigator.clipboard.writeText(txt); } catch (err) {}
    try { window.dunnLinks.bot('Тренировка ' + dm(f.date)); $('w-hint').textContent = 'Текст в буфере: в чате зажми поле → «Вставить» → отправить. Черновик сброшу, когда запишу в Notion.'; }
    catch (err) { $('w-hint').textContent = 'Текст в буфере, открой чат с ботом и вставь.'; } }
});

function pickDay(i) {
  if (i < 0 || i >= FD.length || i === fdi) return;
  fdi = i; renderFood();
  try { tg() && tg().HapticFeedback.selectionChanged(); } catch (e) {}
  const on = document.querySelector('#fdays .strip button.on'); on && on.scrollIntoView({block: 'nearest', inline: 'center'});
}
$('fdays').onchange = e => { if (e.target.type !== 'date' || !e.target.value) return;
  const i = FD.findIndex(y => y.d === e.target.value); if (i >= 0) pickDay(i); else renderFood(); };
$('fdays').onclick = e => { if (e.target.type === 'date') { try { e.target.showPicker(); } catch (err) {} return; }
 const b = e.target.closest('button'); if (!b || b.disabled) return;
  if (b.dataset.step) pickDay(fdi + Number(b.dataset.step)); else if (b.dataset.i) pickDay(Number(b.dataset.i)); };
// свайп по карточкам еды: вправо — день назад, влево — вперёд
(() => { let x0 = null, y0 = 0; const el = document.querySelector('[data-tab="food"]');
  el.addEventListener('touchstart', e => { if (e.target.closest('.strip')) { x0 = null; return; } x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive: true});
  el.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) pickDay(fdi + (dx > 0 ? 1 : -1)); }, {passive: true}); })();

// ── переключение вкладок; последняя открытая запоминается на устройстве
const TABS = ['home', 'food', 'body', 'gym', 'tasks', 'money'];
function show(tab) {
  if (!TABS.includes(tab)) tab = 'home';
  document.querySelectorAll('.tab').forEach(s => s.hidden = s.dataset.tab !== tab);
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  store.set('dunn_tab', tab); window.scrollTo(0, 0);
  try { tg() && tg().HapticFeedback.selectionChanged(); } catch (e) {}
}
$('nav').onclick = e => { const b = e.target.closest('button'); if (b) show(b.dataset.tab); };
$('tiles').onclick = e => { const x = e.target.closest('[data-go]'); if (x) show(x.dataset.go); };
// задача → Notion. Вызов прямо в обработчике нажатия: Telegram открывает ссылки только в ответ на действие
$('tasks').onclick = e => { const x = e.target.closest('li[data-id]'); if (!x) return;
  try { window.dunnLinks.notion(x.dataset.id); } catch (err) { /* нет dunnLinks или id не тот — ничего не открываем */ } };

// ── «+»: Данич заполняет форму, фраза уходит черновиком в чат с ботом, отправляет он сам.
// В фразу идёт только то, что он ввёл; данные витрины туда не попадают.
const ADD = {
  w: {f: '<input id="a1" inputmode="decimal" placeholder="вес, кг (83.2)">', mk: () => num('a1') && 'Вес ' + num('a1')},
  s: {f: '<input id="a1" inputmode="numeric" placeholder="шаги за день">', mk: () => num('a1') && 'Шаги ' + num('a1')},
  f: {f: '<textarea id="a1" placeholder="что съел, сколько (или опиши фото, его кинешь в чат)"></textarea>', mk: () => txt('a1') && 'Съел: ' + txt('a1')},
  m: {f: '<input id="a1" inputmode="decimal" placeholder="сумма, ₽"><input id="a2" placeholder="на что (Пятёрочка, такси…)">', mk: () => num('a1') && (txt('a2') ? txt('a2') + ' ' : '') + '-' + num('a1')},
  g: {f: '<textarea id="a1" placeholder="что делал: упражнения, веса, подходы; минуты; RPE; где болело"></textarea>', mk: () => txt('a1') && 'Тренировка: ' + txt('a1')},
  i: {f: '<textarea id="a1" placeholder="мысль, задача, идея — как есть"></textarea>', mk: () => txt('a1') && 'В инбокс: ' + txt('a1')},
};
const txt = id => ($(id) ? $(id).value : '').trim().slice(0, 450);
const num = id => { const v = txt(id).replace(',', '.').replace(/\s/g, ''); return /^\d+(\.\d+)?$/.test(v) ? v : ''; };
let addKind = 'w';
function addPick(k) {
  addKind = k; $('add-f').innerHTML = ADD[k].f; $('add-hint').textContent = '';
  document.querySelectorAll('#add-kind button').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  const first = $('a1'); first && first.focus();
}
$('addbtn').onclick = () => { $('add').hidden = false; addPick(addKind); };
$('add-x').onclick = () => { $('add').hidden = true; };
$('add').onclick = e => { if (e.target.id === 'add') $('add').hidden = true; };
$('add-kind').onclick = e => { const b = e.target.closest('button'); if (b) addPick(b.dataset.k); };
$('add-go').onclick = () => {
  const phrase = ADD[addKind].mk();
  if (!phrase) { $('add-hint').textContent = addKind === 'w' || addKind === 's' || addKind === 'm' ? 'Нужно число.' : 'Пусто.'; return; }
  // черновик ?text= боту Telegram не подставляет (проверено 03.11 на телефоне Данича) — работает буфер обмена
  try { navigator.clipboard && navigator.clipboard.writeText(phrase).catch(() => {}); } catch (e) {}
  try { window.dunnLinks.bot(phrase); $('add-hint').textContent = 'Фраза в буфере: в чате зажми поле ввода → «Вставить» → отправить.'; }
  catch (e) { $('add-hint').textContent = 'Не открылось. Фраза в буфере обмена — вставь в чат сам.'; }
};

// ── экран входа: wait → setup (ключа ещё нет) | unlock; key — показать DUNN-KEY для Дана
let K = null;        // зашифрованный фразой ключ Данича из CloudStorage
let mode = 'setup';  // setup | change | reset
function view(v) {
  ['wait', 'unlock', 'setup', 'key'].forEach(n => $('v-' + n).hidden = n !== v);
  $('links').hidden = v !== 'unlock'; $('back').hidden = !(v === 'setup' && K);
  $('lock').style.display = ''; $('app').hidden = true; $('nav').hidden = true;
}
function msg(text, ok) { $('err').textContent = text || ''; $('err').className = ok ? 'ok' : ''; }
async function busy(id, fn) {
  const b = $(id), label = b.textContent; b.disabled = true; b.textContent = '…';
  try { await fn(); } finally { b.disabled = false; b.textContent = label; }
}
function showKey(note) { $('k-note').innerHTML = note; $('keytxt').value = 'DUNN-KEY:' + K.pub; msg(''); view('key'); }
function setup(m) {
  mode = m; msg('');
  ['cur', 'np1', 'np2'].forEach(i => $(i).value = '');
  $('cur').hidden = m !== 'change';
  $('mk').textContent = m === 'change' ? 'Сменить фразу' : 'Создать ключ';
  $('s-note').innerHTML = {
    setup: 'Придумай фразу-пароль для витрины. Она останется только у тебя: ни Дан, ни хост её не знают, поэтому и восстановить её некому.',
    change: 'Смена фразы. Ключ остаётся прежним, Дану ничего отправлять не нужно.',
    reset: 'Новый ключ, если фраза забыта. Старый перестанет работать: после создания отправь новый ключ Дану, витрина откроется после его следующей публикации.',
  }[m] + (cloud() ? '' : '<small>Витрина открыта не из Telegram: ключ сохранится только в этом браузере. Лучше открыть её кнопкой бота.</small>');
  view('setup');
}

async function openWith(priv, kid) {
  let enc;
  try { enc = await (await fetch('data.enc.json?t=' + Date.now(), {cache: 'no-store'})).json(); }
  catch (e) { view('unlock'); msg('Нет связи с витриной. Попробуй позже.'); return false; }
  if (enc.v !== 2 || !enc.kid) { showKey('Дан ещё не получил твой ключ. Отправь ему сообщение ниже целиком: в нём нет ничего секретного, это открытый ключ.'); return false; }
  if (enc.kid !== kid) { showKey('Данные зашифрованы <b>другим</b> ключом. Если ты недавно создавал новый ключ, отправь его Дану ещё раз. Если нет, ключ на сервере подменён: напиши Al.'); return false; }
  let d;
  try { d = await decrypt(enc, priv); } catch (e) { view('unlock'); msg('Данные повреждены или подменены. Напиши Al.'); return false; }
  $('lock').style.display = 'none'; $('app').hidden = false; $('nav').hidden = false;
  render(d); show(store.get('dunn_tab') || 'home');
  return true;
}

$('go').onclick = () => busy('go', async () => {
  msg('');
  let pk8;
  try { pk8 = await unwrap(K, $('pw').value.trim()); } catch (e) { return msg('Не подошло. Проверь фразу.'); }
  $('pw').value = '';
  const priv = await importPriv(pk8), kid = await kidOf(K.pub);
  if ($('rem').checked) await remSet({priv, kid}); else await remDel();
  await openWith(priv, kid);
});
$('pw').onkeydown = e => { if (e.key === 'Enter') $('go').click(); };
$('mk').onclick = () => busy('mk', async () => {
  const p1 = $('np1').value.trim(), p2 = $('np2').value.trim();
  if (p1.length < 10) return msg('Нужно хотя бы 10 символов, лучше 3–4 слова.');
  if (p1 !== p2) return msg('Фразы не совпадают.');
  if (mode === 'change') {
    let pk8;
    try { pk8 = await unwrap(K, $('cur').value.trim()); } catch (e) { return msg('Текущая фраза не подошла.'); }
    K = await wrap(pk8, K.pub, p1);
    await kset(KEY_ITEM, JSON.stringify(K)); await remDel();
    view('unlock'); return msg('Фраза сменена.', true);
  }
  const kp = await crypto.subtle.generateKey(EC, true, ['deriveBits']);
  K = await wrap(await crypto.subtle.exportKey('pkcs8', kp.privateKey), u64(await crypto.subtle.exportKey('raw', kp.publicKey)), p1);
  const synced = await kset(KEY_ITEM, JSON.stringify(K)); await remDel();
  showKey('Ключ создан' + (synced ? '' : ' и сохранён только в этом браузере') + '. Отправь Дану сообщение ниже целиком: в нём нет ничего секретного, это открытый ключ.');
});
$('copy').onclick = async () => {
  const t = $('keytxt');
  try { await navigator.clipboard.writeText(t.value); } catch (e) { t.focus(); t.select(); try { document.execCommand('copy'); } catch (e2) {} }
  msg('Скопировано.', true);
};
$('done').onclick = () => { view('unlock'); msg(''); };
$('l-change').onclick = () => setup('change');
$('l-reset').onclick = () => setup('reset');
$('l-back').onclick = () => { view('unlock'); msg(''); };
$('lockbtn').onclick = async () => { await remDel(); view('unlock'); msg(''); };

async function boot() {
  store.del('dunn_pw');  // от старой схемы: там фраза лежала открытым текстом
  try { K = JSON.parse(await kget(KEY_ITEM) || 'null'); } catch (e) { K = null; }
  if (!K || K.v !== 2) return setup('setup');
  const r = await remGet();
  if (r && r.priv && r.kid === await kidOf(K.pub) && await openWith(r.priv, r.kid)) return;
  if ($('v-key').hidden && $('v-unlock').hidden) view('unlock');
}
</script>
</body>
</html>
